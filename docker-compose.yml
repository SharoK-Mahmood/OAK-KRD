services:
  postgres:
    image: postgres:16-alpine
    container_name: oak-krd-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: oak
      POSTGRES_PASSWORD: oak_dev_password
      POSTGRES_DB: oak_krd
    volumes:
      - oak_krd_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oak -d oak_krd"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oak_krd_pgdata:
